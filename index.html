/* on GitHub Pages the links build themselves from the address: <account>.github.io/<repo>/ */
function repoPath() {
  if (CONFIG.REPO) return CONFIG.REPO;
  const m = location.hostname.match(/^([^.]+)\.github\.io$/), seg = location.pathname.split('/').filter(Boolean)[0];
  return m && seg ? `${m[1]}/${seg}` : '';
}
const repo = repoPath();
const asset = n => repo ? `https://github.com/${repo}/releases/latest/download/${n}` : '#start';
['dl', 'dl2'].forEach(id => document.getElementById(id).href = asset('HT-XER-Audit.zip'));
document.getElementById('gar').href = asset('HT-XER-Audit-User-Guide-AR.pdf');
document.getElementById('gen').href = asset('HT-XER-Audit-User-Guide-EN.pdf');
/* HT Build-Plan has its own release list (a release here would become «latest» and break the XER-Audit buttons) */
const BP_REPO = 'HTxeraudit/HT-Build-Plan';
['bdl', 'bdl2'].forEach(id => document.getElementById(id).href = `https://github.com/${BP_REPO}/releases/latest/download/HT-Build-Plan.zip`);

/* which page is shown (his ask, 15-Nov-26): the start page with the two programs as two big buttons; a program's page
   only after its button (#xer-audit / #build-plan). Old links to XER-Audit's own sections (#start) still open it. */
let APP = 'home';
const legalKey = () => APP === 'bp' ? 'b_legal' : APP === 'xer' ? 'legal' : 'home_legal';
function appOf(hash) {
  if (hash === '#build-plan') return 'bp';
  if (hash === '#xer-audit' || hash === '#start') return 'xer';
  if (hash === '#bstart') return 'bp';
  return 'home';
}
function setApp(a, scroll) {
  APP = ['bp', 'xer'].includes(a) ? a : 'home';
  document.getElementById('p-home').hidden = APP !== 'home';
  document.getElementById('p-xer').hidden = APP !== 'xer';
  document.getElementById('p-bp').hidden = APP !== 'bp';
  document.getElementById('apps').hidden = APP === 'home';
  document.getElementById('tab-xer').setAttribute('aria-selected', APP === 'xer');
  document.getElementById('tab-bp').setAttribute('aria-selected', APP === 'bp');
  document.getElementById('logoName').textContent = APP === 'bp' ? 'Build-Plan' : APP === 'xer' ? 'XER-Audit' : '';
  document.title = APP === 'bp' ? 'HT Build-Plan' : APP === 'xer' ? 'HT XER-Audit' : 'HT XER-Audit · HT Build-Plan';
  const t = T[document.documentElement.lang] || T.ar;
  document.getElementById('legal').innerHTML = t[legalKey()];
  if (scroll) window.scrollTo({top: 0});
}
document.querySelectorAll('[data-app]').forEach(b => b.addEventListener('click', e => {
  e.preventDefault(); history.pushState(null, '', b.getAttribute('href')); setApp(b.dataset.app, true);
}));
document.querySelector('.brand').addEventListener('click', e => {
  e.preventDefault(); history.pushState(null, '', location.pathname + location.search); setApp('home', true);
});
window.addEventListener('popstate', () => setApp(appOf(location.hash), true));
window.addEventListener('hashchange', () => { const a = appOf(location.hash); if (a !== 'home' && a !== APP) setApp(a); });

const v = document.getElementById('video');
if (CONFIG.YOUTUBE) v.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(CONFIG.YOUTUBE)}" title="HT XER-Audit" allowfullscreen loading="lazy"></iframe>`;
else v.innerHTML = '<video controls preload="none" poster="assets/poster.jpg" src="assets/HT-XER-Audit-Promo.mp4"></video>';

function setLang(l) {
  const t = T[l], root = document.documentElement;
  root.lang = l; root.dir = l === 'ar' ? 'rtl' : 'ltr'; document.body.classList.toggle('en', l === 'en');
  document.querySelectorAll('[data-t]').forEach(e => { e.textContent = t[e.dataset.t]; });
  document.getElementById('legal').innerHTML = t[legalKey()];
  document.querySelectorAll('[data-alt]').forEach(e => e.alt = t[e.dataset.alt]);
  document.getElementById('lang').textContent = t.lang;
  const c = document.getElementById('contact'); c.replaceChildren();
  const add = (href, text) => { const a = document.createElement('a'); a.className = 'btn sec'; a.href = href; a.textContent = text; a.rel = 'noopener'; c.append(a); };
  if (CONFIG.EMAIL) add(`mailto:${CONFIG.EMAIL}`, `${t.mail}: ${CONFIG.EMAIL}`);
  try { localStorage.setItem('ht-lang', l); } catch (e) {}
}
let start = new URLSearchParams(location.search).get('lang');
if (!T[start]) { try { start = localStorage.getItem('ht-lang'); } catch (e) {} }
if (!T[start]) start = 'ar';
{ const q = new URLSearchParams(location.search).get('app'); setApp(q === 'bp' || q === 'xer' ? q : appOf(location.hash)); }
setLang(start);
document.getElementById('lang').onclick = () => setLang(document.documentElement.lang === 'ar' ? 'en' : 'ar');
</script>
