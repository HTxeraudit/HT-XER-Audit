<style>
:root{--navy:#070d24;--navy2:#0d1740;--navy3:#14225c;--line:rgba(150,185,255,.2);--gold:#f0bf52;--gold2:#c98d22;--ink:#eef3ff;--ink2:#b4c1e2;--green:#21d07a;--gutter:16px}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--navy);color:var(--ink);font:500 17px/1.75 Cairo,"Segoe UI",Tahoma,sans-serif;-webkit-text-size-adjust:100%}
[lang=en] body,body.en{font-family:"Segoe UI",Bahnschrift,Tahoma,sans-serif}
a{color:var(--gold)}
img,video,iframe{display:block;max-width:100%}
.wrap{width:min(1120px,100%);margin:auto;padding-inline:var(--gutter)}
header.top{display:flex;align-items:center;justify-content:space-between;padding-block:18px}
.brand{display:inline-flex;flex-direction:column;align-items:flex-start;text-decoration:none}
.by{font:600 clamp(14px,1.5vw,17px)/1.2 Bahnschrift,"Segoe UI",sans-serif;color:var(--gold);letter-spacing:.02em;margin-top:5px}
.logo{display:inline-flex;align-items:baseline;gap:.3em;font:600 clamp(28px,3.4vw,38px)/1.1 Bahnschrift,"Segoe UI",sans-serif;color:#fff}
.logo b{font-weight:800;font-style:italic;font-size:1.34em;color:var(--gold)}
.lang{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 14px;font:inherit;font-size:15px;cursor:pointer;min-height:40px}
.lang:hover{border-color:var(--gold)}
.hero{background:radial-gradient(900px 480px at 50% -10%,#1b3187 0,transparent 70%);text-align:center;padding-block:34px 56px}
.free{display:inline-block;color:var(--green);border:1px solid rgba(33,208,122,.55);border-radius:999px;padding:2px 16px;font-weight:700;font-size:16px;margin-bottom:14px}
h1{font-weight:900;font-size:clamp(30px,5.4vw,54px);line-height:1.25;margin:0 0 14px;text-wrap:balance}
.lead{color:var(--ink2);font-size:clamp(17px,2.2vw,20px);max-width:760px;margin:0 auto 26px;text-wrap:pretty}
.cta{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:8px 26px;border-radius:10px;font-weight:700;text-decoration:none;transition:transform .12s,background .12s}
.btn.pri{background:linear-gradient(180deg,#f8d57e,var(--gold) 45%,var(--gold2));color:#1a1300;font-weight:900}
.btn.pri:hover{transform:translateY(-1px)}
.btn.sec{border:1px solid var(--line);color:var(--ink)}
.btn.sec:hover{border-color:var(--gold)}
.note{color:var(--ink2);font-size:14.5px;margin-top:12px}
.video{margin:38px auto 0;max-width:940px;aspect-ratio:16/9;border-radius:14px;overflow:hidden;box-shadow:0 0 0 1px var(--line),0 30px 80px rgba(0,0,0,.6);background:#000}
.video video,.video iframe{width:100%;height:100%;border:0}
section{padding-block:52px;border-top:1px solid var(--line)}
h2{font-weight:900;font-size:clamp(25px,3.6vw,34px);line-height:1.3;margin:0 0 8px}
.sub{color:var(--ink2);margin:0 0 28px;max-width:760px}
.feature{display:grid;grid-template-columns:1fr 1.25fr;gap:32px;align-items:center;padding-block:24px}
.feature h3{font-size:23px;font-weight:900;color:var(--gold);margin:0 0 6px;line-height:1.35}
.feature p{margin:0 0 10px;color:var(--ink2)}
.feature ul{margin:0;padding-inline-start:20px;color:var(--ink)}
.feature li{margin-block:3px}
.shot{border-radius:10px;overflow:hidden;box-shadow:0 0 0 1px var(--line),0 18px 50px rgba(0,0,0,.5);background:var(--navy2)}
.shot img{width:100%;height:auto}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:28px;counter-reset:s}
.steps li{counter-increment:s;min-width:0}
.steps li::before{content:counter(s);display:block;font:800 40px Bahnschrift,"Segoe UI",sans-serif;color:var(--gold);line-height:1.2}
.steps b{display:block;font-size:19px;margin-bottom:4px}
.steps span{color:var(--ink2)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.facts b{display:block;font-size:19px;color:var(--ink);margin-bottom:2px}
.facts span{color:var(--ink2)}
.contact{display:flex;flex-wrap:wrap;gap:12px}
footer{border-top:1px solid var(--line);padding-block:24px;color:var(--ink2);font-size:14px}
bdi{unicode-bidi:isolate;white-space:nowrap}
@media (max-width:820px){.feature{grid-template-columns:1fr;gap:16px}.feature .shot{order:2}.steps,.facts{grid-template-columns:1fr;gap:20px}section{padding-block:40px}.btn{width:100%}.contact .btn{width:auto;flex:1 1 auto}}

/* on GitHub Pages the links build themselves from the address: <account>.github.io/<repo>/ */
function repoPath() {
  if (CONFIG.REPO) return CONFIG.REPO;
  const m = location.hostname.match(/^([^.]+)\.github\.io$/), seg = location.pathname.split('/').filter(Boolean)[0];
  return m && seg ? `${m[1]}/${seg}` : '';
}
const repo = repoPath();
const asset = n => repo ? `https://github.com/${repo}/releases/latest/download/${n}` : '#start';
['dl', 'dl2'].forEach(id => document.getElementById(id).href = asset('HT-XER-Audit.zip'));
document.getElementById('gar').href = asset('HT-XER-Audit-User-Guide-AR.pdf');
document.getElementById('gen').href = asset('HT-XER-Audit-User-Guide-EN.pdf');

const v = document.getElementById('video');
if (CONFIG.YOUTUBE) v.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(CONFIG.YOUTUBE)}" title="HT XER-Audit" allowfullscreen loading="lazy"></iframe>`;
else v.innerHTML = '<video controls preload="none" poster="assets/poster.jpg" src="assets/HT-XER-Audit-Promo.mp4"></video>';

function setLang(l) {
  const t = T[l], root = document.documentElement;
  root.lang = l; root.dir = l === 'ar' ? 'rtl' : 'ltr'; document.body.classList.toggle('en', l === 'en');
  document.querySelectorAll('[data-t]').forEach(e => { const k = e.dataset.t; if (k === 'legal') e.innerHTML = t[k]; else e.textContent = t[k]; });
  document.querySelectorAll('[data-alt]').forEach(e => e.alt = t[e.dataset.alt]);
  document.getElementById('lang').textContent = t.lang;
  const c = document.getElementById('contact'); c.replaceChildren();
  const add = (href, text) => { const a = document.createElement('a'); a.className = 'btn sec'; a.href = href; a.textContent = text; a.rel = 'noopener'; c.append(a); };
  if (CONFIG.EMAIL) add(`mailto:${CONFIG.EMAIL}`, `${t.mail}: ${CONFIG.EMAIL}`);
  try { localStorage.setItem('ht-lang', l); } catch (e) {}
}
let start = new URLSearchParams(location.search).get('lang');
if (!T[start]) { try { start = localStorage.getItem('ht-lang'); } catch (e) {} }
if (!T[start]) start = 'ar';
setLang(start);
document.getElementById('lang').onclick = () => setLang(document.documentElement.lang === 'ar' ? 'en' : 'ar');
